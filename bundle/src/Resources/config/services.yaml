services:
    _defaults:
        autowire: true
        autoconfigure: true

    Dan\Probe\Scenario\ScenarioRegistry:
        arguments:
            $scenarios: !tagged_iterator dan.scenario

    # Corpus scenarios (see CORPUS.md for the coverage matrix)
    Dan\Probe\Scenario\Corpus\ProductKeywordListingScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductDeepReadScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\SyntheticJsonPathScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductEmptyResultScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductBelowPageScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductPageBoundaryScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductMultiPageScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductStockRangeScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductTaxToOneScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductInCategoryScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductInheritedNameScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductUnindexedEanScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductGroupedByTaxScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductScoreQueryScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ProductPostFilterScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\CategoryTranslatedNameScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\CategoryByProductCountScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\ReviewDeepAssociationScenario:
        tags:
            - { name: dan.scenario }

    Dan\Probe\Scenario\Corpus\MediaByExtensionScenario:
        tags:
            - { name: dan.scenario }


    Dan\Probe\Seeding\Dataset\DatasetSeeder: ~
    Dan\Probe\Seeding\Fingerprint\DatasetFingerprinter: ~
    # The single recorder instance shared with the recording middleware that
    # bin/dan-console attaches to the kernel connection before the container
    # exists (RecordingBootstrap).
    Dan\Probe\Recorder\QueryRecorder:
        public: true
        factory: ['Dan\Probe\Recorder\RecordingBootstrap', 'recorder']
    Dan\Probe\Execution\Measurement\ScenarioMeasurer: ~
    Dan\Probe\Execution\Measurement\QueryPlanCapture: ~
    Dan\Probe\Execution\Result\ScenarioResultWriter: ~

    # Shopware's EntityCompilerPass creates dan_synthetic_blob.repository from
    # the autoconfigured definition using that runtime's repository signature.
    Dan\Probe\Synthetic\SyntheticBlobDefinition: ~
    # Public like QueryRecorder: the kernel tests fetch it from the container,
    # and the compiled container would otherwise inline it into DatasetSeeder.
    Dan\Probe\Synthetic\SyntheticSchemaInstaller:
        public: true

    # In-app measurement agent. #[AsCommand] supplies the console.command tag.
    Dan\Probe\Execution\Command\ExecuteScenariosCommand: ~
    Dan\Probe\Seeding\Command\SeedTierCommand: ~
    Dan\Probe\Seeding\Command\FingerprintDatasetCommand: ~
