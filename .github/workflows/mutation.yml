name: Mutation report

# Nightly full-src mutation report (infection.full.json5). Unlike the PR
# quality gate - which mutates only the deterministic core and enforces a
# minimum covered MSI - this run covers the whole harness and never fails
# the build: it exists to watch scope drift, i.e. boundary code that grew
# logic without growing tests.

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

jobs:
  full-mutation:
    name: Full-src mutation report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: pcov
      - run: composer install --no-interaction --no-progress
      - name: infection (full src, report only)
        run: vendor/bin/infection --configuration=infection.full.json5 --threads=max --no-progress
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_id }}
          path: |
            infection.log
            infection-summary.log
          retention-days: 90
